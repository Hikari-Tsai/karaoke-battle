# Publishes the static site in site/ to GitHub Pages. Before uploading it
# refreshes the "thanks to the issue reporters" line from the repo's issues
# (scripts/issue_reporters.py), so it also runs once a day.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/issue_reporters.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 16 * * *' # daily, 00:17 Taiwan time
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Issue reporters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_reporters.py "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
