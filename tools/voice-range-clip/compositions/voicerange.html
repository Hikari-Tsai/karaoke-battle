  <script>
    const tl = gsap.timeline({ paused: true });
    const ON = { backgroundColor: "#c8befa", color: "#1a1030", borderColor: "#c8befa" };
    const OFF = { backgroundColor: "#0c0c10", color: "#b9b5c8", borderColor: "rgba(255,255,255,0.16)" };
    const click = (at) =>
      tl.fromTo("#v-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);
    const flash = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 0.94, duration: 0.09, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, at);
    const swap = (from, to, at) => {
      tl.set(from, { opacity: 0 }, at);
      tl.set(to, { opacity: 1 }, at);
      tl.fromTo(to, { scale: 1.12, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out" }, at);
    };

    // ---- the keys: which ones the song covers when the key is shifted by s ----
    const isBlack = (m) => [1, 3, 6, 8, 10].includes((m - 36) % 12);
    const keyColor = (m, s) => {
      const main = m >= 52 + s && m <= 69 + s; // E3-A4 in the original key
      const ext = m >= 50 + s && m <= 71 + s; // down to D3, up to B4
      if (isBlack(m)) return main ? "#5b4fb0" : ext ? "#3a3466" : "#17161c";
      return main ? "#9a8ee6" : ext ? "#cfc8f5" : "#e9e6f2";
    };
    const keyCenter = (m) => {
      const oct = Math.floor((m - 36) / 12);
      const pc = (m - 36) % 12;
      const white = { 0: 0, 2: 1, 4: 2, 5: 3, 7: 4, 9: 5, 11: 6 };
      const black = { 1: 1, 3: 2, 6: 4, 8: 5, 10: 6 };
      return pc in white ? 40 + 56 * (oct * 7 + white[pc]) + 27 : 40 + 56 * (oct * 7 + black[pc]);
    };
    const paint = (from, to, at, dur) => {
      for (let m = 36; m <= 84; m++) {
        if (keyColor(m, from) !== keyColor(m, to)) tl.to(`#v-k${m}`, { backgroundColor: keyColor(m, to), duration: dur }, at);
      }
    };
    const SUNG = [43, 45, 47, 48, 50, 52, 53, 55, 57, 59, 60, 62, 64];

    // ---- start state (also the loop point) ----
    for (let m = 36; m <= 84; m++) gsap.set(`#v-k${m}`, { backgroundColor: keyColor(m, 0) });
    gsap.set("#v-step1", ON);
    gsap.set("#v-step2, #v-step3", OFF);
    gsap.set("#v-v1, #v-v2, #v-v3, #v-v4, #v-v5, #v-mb, #v-fb, #v-ya, #v-yb, #v-m1", { opacity: 0 });
    gsap.set("#v-you-bar", { scaleX: 0, transformOrigin: "0% 50%" });
    gsap.set("#v-you-label", { opacity: 0.35 });
    gsap.set(".lv", { scaleY: 0.2, transformOrigin: "50% 50%", opacity: 0.5 });
    gsap.set("#v-cursor-in", { x: 1500, y: 640 });
    gsap.set("#v-arrow", { x: keyCenter(43) - 14 });

    // ---- step 1: the song's range against the comfortable ranges (0 - 3 s) ----
    tl.fromTo("#v-song", { y: 0 }, { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.5);
    tl.fromTo("#v-ma", { scale: 1, transformOrigin: "0% 50%" }, { scale: 1.1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4);
    tl.fromTo("#v-fa", { scale: 1, transformOrigin: "0% 50%" }, { scale: 1.1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.0);

    // ---- step 2: sing a scale, G2 up to E4 (3 - 8 s) ----
    tl.to("#v-step1", { ...OFF, duration: 0.3 }, 3.0);
    tl.to("#v-step2", { ...ON, duration: 0.3 }, 3.0);
    tl.to(".lv", { opacity: 1, duration: 0.2 }, 3.3);
    tl.to("#v-you-label", { opacity: 1, duration: 0.2 }, 3.3);
    tl.to(".lv", { scaleY: 1, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 19, stagger: 0.05 }, 3.4);
    tl.to("#v-arrow", { opacity: 1, duration: 0.15 }, 3.5);
    const youLeft = 264;
    SUNG.forEach((m, i) => {
      const at = 3.55 + i * 0.23;
      tl.set("#v-arrow", { x: keyCenter(m) - 14 }, at);
      tl.to(`#v-k${m}`, { backgroundColor: "#ffa25c", duration: 0.05 }, at);
      tl.to(`#v-k${m}`, { backgroundColor: keyColor(m, 0), duration: 0.2 }, at + 0.22);
      tl.fromTo(`#v-d${m}`, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, at + 0.08);
      // the orange bar reaches the right edge of the key just sung
      tl.to("#v-you-bar", { scaleX: (keyCenter(m) + 27 - youLeft) / 728, duration: 0.2, ease: "power2.out" }, at + 0.05);
    });
    tl.to("#v-arrow", { opacity: 0, duration: 0.2 }, 6.75);
    tl.to(".lv", { opacity: 0.5, duration: 0.2 }, 6.75);
    swap("#v-m0", "#v-m1", 6.8);
    swap("#v-y0", "#v-ya", 7.2);

    // ---- step 3: one-click key into your own range (8 - 13.8 s) ----
    tl.to("#v-step2", { ...OFF, duration: 0.3 }, 8.0);
    tl.to("#v-step3", { ...ON, duration: 0.3 }, 8.0);
    tl.fromTo("#v-cursor-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 8.0);
    tl.to("#v-cursor-in", { x: 1392, y: 812, duration: 0.8, ease: "power3.inOut" }, 8.05);
    click(9.0);
    flash("#v-auto", 9.0);
    tl.fromTo("#v-menu", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 9.1);
    tl.to("#v-cursor-in", { x: 1560, y: 722, duration: 0.6, ease: "power3.inOut" }, 9.9);
    tl.to("#v-mi3", { backgroundColor: "rgba(200,190,250,0.22)", duration: 0.2 }, 10.3);
    click(10.9);
    tl.to("#v-menu", { opacity: 0, y: 12, duration: 0.25, ease: "power2.in" }, 11.0);
    tl.set("#v-mi3", { backgroundColor: "rgba(200,190,250,0)" }, 11.3);
    // five semitones down, one at a time
    tl.to("#v-song", { x: -168, duration: 1.3, ease: "none" }, 11.25);
    [1, 2, 3, 4, 5].forEach((n) => {
      const at = 11.25 + n * 0.26;
      paint(-(n - 1), -n, at - 0.1, 0.12);
      tl.set(`#v-v${n - 1}`, { opacity: 0 }, at - 0.1);
      tl.set(`#v-v${n}`, { opacity: 1 }, at - 0.1);
      tl.fromTo(`#v-v${n}`, { scale: 1.3, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.22, ease: "power3.out" }, at - 0.1);
    });
    swap("#v-ma", "#v-mb", 12.7);
    swap("#v-fa", "#v-fb", 12.85);
    swap("#v-ya", "#v-yb", 13.0);

    // ---- back to the original key, and to the start so the clip loops ----
    tl.to("#v-cursor-in", { x: 1660, y: 812, duration: 0.55, ease: "power3.inOut" }, 13.9);
    click(14.65);
    tl.fromTo("#v-reset", { backgroundColor: "rgba(200,190,250,0)" }, { backgroundColor: "rgba(200,190,250,0.3)", duration: 0.12, yoyo: true, repeat: 1 }, 14.65);
    tl.to("#v-song", { x: 0, duration: 0.5, ease: "power3.inOut" }, 14.75);
    paint(-5, 0, 14.8, 0.4);
    tl.set("#v-v5", { opacity: 0 }, 14.85);
    tl.set("#v-v0", { opacity: 1 }, 14.85);
    tl.set("#v-mb, #v-fb", { opacity: 0 }, 15.0);
    tl.set("#v-ma, #v-fa", { opacity: 1 }, 15.0);
    tl.to("#v-cursor-in", { opacity: 0, duration: 0.25 }, 15.1);
    tl.to(".dot", { opacity: 0, duration: 0.3 }, 15.3);
    tl.to("#v-you-bar", { scaleX: 0, duration: 0.35, ease: "power2.in" }, 15.3);
    tl.to("#v-you-label", { opacity: 0.35, duration: 0.3 }, 15.3);
    tl.set("#v-yb, #v-m1", { opacity: 0 }, 15.45);
    tl.set("#v-y0, #v-m0", { opacity: 1 }, 15.45);
    tl.to("#v-step3", { ...OFF, duration: 0.25 }, 15.4);
    tl.to("#v-step1", { ...ON, duration: 0.25 }, 15.45);

    window.__timelines["voicerange"] = tl;
  </script>
</template>
