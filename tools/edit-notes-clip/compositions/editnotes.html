  <script>
    // The original vocal's pitch: it runs through every note except the fifth,
    // where it sits three semitones (78 px) above the transcribed note.
    (() => {
      const row = (r) => r * 26 + 13;
      const phrases = [
        [
          [130, 280, 12],
          [300, 410, 11],
          [430, 630, 9],
          [660, 760, 11],
          [780, 1020, 7],
        ],
        [
          [1050, 1180, 9],
          [1200, 1370, 11],
          [1400, 1550, 12],
          [1570, 1680, 14],
        ],
      ];
      const smooth = (t) => t * t * (3 - 2 * t);
      let d = "";
      phrases.forEach((notes) => {
        const x0 = notes[0][0] - 6;
        const x1 = notes[notes.length - 1][1] + 6;
        for (let x = x0; x <= x1; x += 4) {
          let y = row(notes[notes.length - 1][2]);
          for (let i = 0; i < notes.length; i++) {
            const [a, b, r] = notes[i];
            if (x <= b - 8) {
              y = row(r);
              if (i > 0 && x < a + 14) {
                // glide in from the previous note
                const from = notes[i - 1][1] - 8;
                y = row(notes[i - 1][2]) + (row(r) - row(notes[i - 1][2])) * smooth((x - from) / (a + 14 - from));
              }
              break;
            }
          }
          const scoop = Math.max(0, 1 - (x - x0) / 34) * 16; // slide up into the phrase
          const tail = Math.max(0, (x - (x1 - 120)) / 120); // vibrato at the end of the phrase
          y += scoop + 2.2 * Math.sin(x * 0.085) + 1.3 * Math.sin(x * 0.031 + 1) + 5 * tail * Math.sin(x * 0.21);
          d += (x === x0 ? "M" : "L") + x + " " + y.toFixed(1) + " ";
        }
      });
      document.querySelector("#e-curve-path").setAttribute("d", d.trim());
    })();

    const tl = gsap.timeline({ paused: true });
    const ON = { backgroundColor: "#c8befa", color: "#1a1030", borderColor: "#c8befa" };
    const OFF = { backgroundColor: "#0c0c10", color: "#b9b5c8", borderColor: "rgba(255,255,255,0.16)" };
    const click = (at) =>
      tl.fromTo("#e-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);
    const flash = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 0.94, duration: 0.09, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, at);

    // ---- start state (also the loop point) ----
    gsap.set("#e-step1", ON);
    gsap.set("#e-step2, #e-step3", OFF);
    gsap.set("#e-p1, #e-p2, #e-p3", { opacity: 0 });
    gsap.set("#e-cursor-in", { x: 760, y: 640 });
    gsap.set("#e-restore", { opacity: 0.45 });

    // ---- step 1: press "Edit notes" (0 - 2.6 s) ----
    tl.fromTo("#e-cursor-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
    tl.to("#e-cursor-in", { x: 372, y: 880, duration: 0.8, ease: "power3.inOut" }, 0.35);
    click(1.3);
    flash("#e-edit", 1.3);
    tl.to("#e-edit", { backgroundColor: "#c8befa", color: "#1a1030", duration: 0.2 }, 1.34);
    tl.fromTo("#e-hint", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 1.42);

    // ---- step 2: drag the wrong note up three semitones (2.6 - 8.2 s) ----
    tl.to("#e-step1", { ...OFF, duration: 0.3 }, 2.6);
    tl.to("#e-step2", { ...ON, duration: 0.3 }, 2.6);
    tl.to("#e-cursor-in", { x: 1064, y: 428, duration: 0.85, ease: "power3.inOut" }, 2.65);
    // press and hold: the note is selected and its pitch sounds
    tl.to("#e-cursor-in", { scale: 0.84, duration: 0.1, transformOrigin: "20% 10%" }, 3.75);
    tl.to("#e-n5", { backgroundColor: "#f9d84a", boxShadow: "0 0 0 5px rgba(249,216,74,0.3)", duration: 0.15 }, 3.78);
    tl.to("#e-key", { opacity: 0.9, duration: 0.15 }, 3.78);
    tl.fromTo("#e-badge", { opacity: 0, scale: 0.8, transformOrigin: "0% 0%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.82);
    tl.fromTo("#e-sine", { scaleY: 0.3, transformOrigin: "50% 50%" }, { scaleY: 1, duration: 0.25, ease: "sine.out" }, 3.82);
    // one semitone at a time, 26 px each
    tl.to("#e-cursor-in", { y: 350, duration: 1.8, ease: "none" }, 4.4);
    [1, 2, 3].forEach((n) => {
      const at = 4.4 + n * 0.6;
      tl.to("#e-n5, #e-key, #e-badge", { y: -26 * n, duration: 0.12, ease: "power2.out" }, at - 0.12);
      tl.set(`#e-p${n - 1}`, { opacity: 0 }, at - 0.06);
      tl.set(`#e-p${n}`, { opacity: 1 }, at - 0.06);
      tl.fromTo(`#e-p${n}`, { scale: 1.3, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "power3.out" }, at - 0.06);
      tl.fromTo("#e-sine", { scaleY: 0.35 }, { scaleY: 1, duration: 0.3, ease: "sine.out" }, at - 0.06);
    });
    tl.to("#e-cursor-in", { scale: 1, duration: 0.1 }, 6.55);
    tl.to("#e-restore", { opacity: 1, duration: 0.3 }, 6.6);
    tl.to("#e-key", { opacity: 0, duration: 0.3 }, 7.5);
    tl.to("#e-badge", { opacity: 0, duration: 0.3 }, 7.5);

    // ---- step 3: restore the automatic transcription (8.2 - 15.2 s) ----
    tl.to("#e-step2", { ...OFF, duration: 0.3 }, 8.2);
    tl.to("#e-step3", { ...ON, duration: 0.3 }, 8.2);
    tl.to("#e-cursor-in", { x: 1484, y: 208, duration: 0.85, ease: "power3.inOut" }, 8.2);
    click(9.25);
    tl.fromTo("#e-restore", { backgroundColor: "rgba(200,190,250,0)" }, { backgroundColor: "rgba(200,190,250,0.3)", duration: 0.12, yoyo: true, repeat: 1 }, 9.25);
    tl.to("#e-scrim", { opacity: 0.5, duration: 0.3 }, 9.35);
    tl.fromTo("#e-dialog", { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 9.38);
    tl.to("#e-cursor-in", { x: 1284, y: 602, duration: 0.75, ease: "power3.inOut" }, 11.2);
    click(12.5);
    flash(".d-ok", 12.5);
    tl.to("#e-dialog", { opacity: 0, scale: 0.96, duration: 0.25, ease: "power2.in" }, 12.62);
    tl.to("#e-scrim", { opacity: 0, duration: 0.3 }, 12.62);
    tl.to("#e-n5", { y: 0, duration: 0.55, ease: "back.out(1.6)" }, 12.85);
    tl.to("#e-n5", { backgroundColor: "#8f84d8", boxShadow: "0 0 0 0px rgba(249,216,74,0)", duration: 0.4 }, 12.9);
    tl.to("#e-restore", { opacity: 0.45, duration: 0.3 }, 12.9);
    // "Done" leaves the editor
    tl.to("#e-cursor-in", { x: 1690, y: 208, duration: 0.6, ease: "power3.inOut" }, 13.6);
    click(14.35);
    flash(".h-done", 14.35);
    tl.to("#e-hint", { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, 14.45);
    tl.to("#e-edit", { backgroundColor: "#34314a", color: "#c8befa", duration: 0.25 }, 14.45);
    tl.to("#e-cursor-in", { opacity: 0, duration: 0.25 }, 14.8);

    // ---- back to the start so the clip loops ----
    tl.to("#e-step3", { ...OFF, duration: 0.25 }, 15.35);
    tl.to("#e-step1", { ...ON, duration: 0.25 }, 15.4);
    tl.set("#e-key, #e-badge", { y: 0 }, 15.5);
    tl.set("#e-p3", { opacity: 0 }, 15.5);
    tl.set("#e-p0", { opacity: 1 }, 15.5);

    window.__timelines["editnotes"] = tl;
  </script>
</template>
