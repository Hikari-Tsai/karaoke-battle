        <div class="opt" id="l-o4" style="top: 426px">
          <svg viewBox="0 0 36 36"><path d="M5 31 L7 23 L24 6 L30 12 L13 29 Z" fill="none" stroke="#c8befa" stroke-width="3" stroke-linejoin="round" /></svg>
          <div class="opt-label">自己輸入歌詞</div>
          <div class="opt-sub">邊聽邊按 Enter 打點</div>
        </div>
        <div class="d-skip">不需要歌詞</div>
      </div>

      <div id="l-paste" class="dialog" data-layout-allow-occlusion data-layout-allow-overlap>
        <div class="d-title">貼上歌詞(AI對齊)</div>
        <div class="d-body">一行一句貼上整首歌詞，App 會自動幫每一句對上時間。</div>
        <div id="l-area">
          <div id="l-ph">第一句歌詞<br />第二句歌詞<br />…</div>
          <div id="l-caret"></div>
          <div class="area-line" id="l-p1" style="top: 18px" data-layout-allow-overlap>把今天唱給明天聽</div>
          <div class="area-line" id="l-p2" style="top: 64px" data-layout-allow-overlap>明天的我也會記得這首歌</div>
          <div class="area-line" id="l-p3" style="top: 110px" data-layout-allow-overlap>風把旋律帶到很遠的地方</div>
          <div class="area-line" id="l-p4" style="top: 156px">我們在副歌裡再見一面</div>
          <div id="l-keycap" data-layout-ignore>⌘ V</div>
        </div>
        <div class="m-label">對時方式</div>
        <div class="m-seg"><div style="left: 0; background: #4a4670">♪ 音符（GAME）</div><div style="left: 268px">AI 聽歌對時</div></div>
        <div class="m-hint">用備歌時轉出的音符對時，幾秒內完成、不用下載。</div>
        <div class="m-track" id="l-track"><div id="l-prog"></div></div>
        <div class="d-cancel">取消</div>
        <div id="l-start">
          <div id="l-sa">開始對時</div>
          <div id="l-sb" data-layout-allow-overlap>對時中…</div>
        </div>
      </div>
    </div>

    <!-- 3. Where we are in the three steps -->
    <div id="l-steps" class="clip layer" data-start="0" data-duration="16" data-track-index="3">
      <div class="step" id="l-step1" style="left: 362px; width: 330px">1　選歌詞來源</div>
      <div class="step-arrow" style="left: 718px">›</div>
      <div class="step" id="l-step2" style="left: 766px; width: 360px">2　貼上整首歌詞</div>
      <div class="step-arrow" style="left: 1152px">›</div>
      <div class="step" id="l-step3" style="left: 1200px; width: 360px">3　自動對上時間</div>
    </div>

    <!-- 4. Pointer -->
    <div id="l-cursor" class="clip layer" data-start="0" data-duration="16" data-track-index="4" data-layout-ignore>
      <svg id="l-cursor-in" viewBox="0 0 44 44">
        <path d="M6 3 L6 35 L15 27 L21 41 L27 38 L21 25 L33 25 Z" fill="#ffffff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const ON = { backgroundColor: "#c8befa", color: "#1a1030", borderColor: "#c8befa" };
    const OFF = { backgroundColor: "#0c0c10", color: "#b9b5c8", borderColor: "rgba(255,255,255,0.16)" };
    const WHITE = "#f3f1f8";
    const GOLD = "#f9d84a";
    const click = (at) =>
      tl.fromTo("#l-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);
    const flash = (sel, at) => tl.fromTo(sel, { scale: 1 }, { scale: 0.95, duration: 0.09, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, at);

    // ---- start state (also the loop point) ----
    gsap.set("#l-step1", ON);
    gsap.set("#l-step2, #l-step3", OFF);
    gsap.set("#l-cursor-in", { x: 1300, y: 560 });
    gsap.set("#l-p1, #l-p2, #l-p3, #l-p4, #l-sb, #l-t1, #l-t2, #l-pause", { opacity: 0 });
    gsap.set("#l-fill", { scaleX: 0, transformOrigin: "0% 50%" });
    gsap.set("#l-prog", { scaleX: 0, transformOrigin: "0% 50%" });

    // ---- step 1: the lyrics button lists where lyrics can come from (0 - 4.5 s) ----
    tl.fromTo("#l-cursor-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
    tl.to("#l-cursor-in", { x: 1754, y: 96, duration: 0.8, ease: "power3.inOut" }, 0.35);
    click(1.2);
    tl.fromTo("#l-btn", { backgroundColor: "rgba(200,190,250,0)" }, { backgroundColor: "rgba(200,190,250,0.35)", duration: 0.12, yoyo: true, repeat: 1 }, 1.2);
    tl.to("#l-scrim", { opacity: 0.5, duration: 0.3 }, 1.3);
    tl.fromTo("#l-none", { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 1.33);
    // the four sources, one after another
    [1, 2, 3, 4].forEach((n, i) => {
      const at = 2.0 + i * 0.32;
      tl.fromTo(
        `#l-o${n}`,
        { borderColor: "rgba(255,255,255,0.22)", backgroundColor: "rgba(200,190,250,0)" },
        { borderColor: "#c8befa", backgroundColor: "rgba(200,190,250,0.16)", duration: 0.16, yoyo: true, repeat: 1, repeatDelay: 0.1 },
        at,
      );
      tl.fromTo(`#l-o${n}`, { x: 0 }, { x: 10, duration: 0.16, yoyo: true, repeat: 1, repeatDelay: 0.1, ease: "power2.out" }, at);
    });
    tl.to("#l-cursor-in", { x: 968, y: 486, duration: 0.75, ease: "power3.inOut" }, 3.3);
    tl.to("#l-o2", { borderColor: "#c8befa", backgroundColor: "rgba(200,190,250,0.16)", duration: 0.2 }, 3.95);
    click(4.25);
    flash("#l-o2", 4.25);
    tl.to("#l-none", { opacity: 0, scale: 0.96, duration: 0.22, ease: "power2.in" }, 4.4);

    // ---- step 2: paste the whole lyrics and start (4.5 - 9.4 s) ----
    tl.to("#l-step1", { ...OFF, duration: 0.3 }, 4.5);
    tl.to("#l-step2", { ...ON, duration: 0.3 }, 4.5);
    tl.fromTo("#l-paste", { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 4.6);
    tl.set("#l-o2", { borderColor: "rgba(255,255,255,0.22)", backgroundColor: "rgba(200,190,250,0)" }, 4.7);
    tl.to("#l-cursor-in", { x: 1180, y: 470, duration: 0.6, ease: "power3.inOut" }, 5.0);
    click(5.7);
    tl.to("#l-area", { borderColor: "#c8befa", duration: 0.15 }, 5.72);
    tl.to("#l-caret", { opacity: 1, duration: 0.1 }, 5.75);
    // paste
    tl.fromTo("#l-keycap", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.2)" }, 6.25);
    tl.to("#l-keycap", { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 6.55);
    tl.to("#l-ph", { opacity: 0, duration: 0.08 }, 6.6);
    tl.to("#l-caret", { opacity: 0, duration: 0.08 }, 6.6);
    [1, 2, 3, 4].forEach((n, i) => {
      tl.fromTo(`#l-p${n}`, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.28, ease: "power3.out" }, 6.64 + i * 0.07);
    });
    tl.to("#l-keycap", { opacity: 0, duration: 0.3 }, 7.3);
    tl.to("#l-cursor-in", { x: 1344, y: 778, duration: 0.75, ease: "power3.inOut" }, 7.4);
    click(8.25);
    flash("#l-start", 8.25);
    tl.set("#l-sa", { opacity: 0 }, 8.34);
    tl.set("#l-sb", { opacity: 1 }, 8.34);
    tl.to("#l-track", { opacity: 1, duration: 0.15 }, 8.34);
    tl.to("#l-prog", { scaleX: 1, duration: 0.85, ease: "power1.inOut" }, 8.38);
    tl.to("#l-paste", { opacity: 0, scale: 0.96, duration: 0.25, ease: "power2.in" }, 9.3);
    tl.to("#l-scrim", { opacity: 0, duration: 0.3 }, 9.3);
    // the paste dialog is hidden now: put it back for the next loop
    tl.set("#l-p1, #l-p2, #l-p3, #l-p4, #l-sb, #l-track", { opacity: 0 }, 9.65);
    tl.set("#l-ph, #l-sa", { opacity: 1 }, 9.65);
    tl.set("#l-prog", { scaleX: 0 }, 9.65);
    tl.set("#l-area", { borderColor: "rgba(255,255,255,0.22)" }, 9.65);

    // ---- step 3: the lyrics are timed; play to see them colour in (9.4 - 15.3 s) ----
    tl.to("#l-step2", { ...OFF, duration: 0.3 }, 9.4);
    tl.to("#l-step3", { ...ON, duration: 0.3 }, 9.4);
    tl.to("#l-nolyric", { opacity: 0, duration: 0.2 }, 9.45);
    tl.fromTo("#l-lyric", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 9.6);
    tl.fromTo("#l-toast", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 9.7);
    tl.to("#l-cursor-in", { x: 182, y: 888, duration: 0.8, ease: "power3.inOut" }, 9.4);
    click(10.25);
    flash(".t-play", 10.25);
    tl.set("#l-play", { opacity: 0 }, 10.3);
    tl.set("#l-pause", { opacity: 1 }, 10.3);
    tl.to("#l-cursor-in", { opacity: 0, duration: 0.25 }, 10.9);
    // the roll scrolls 250 px a second past the playhead at x = 500
    const T0 = 10.35;
    const SPEED = 250;
    tl.to("#l-notes", { x: -1125, duration: 4.5, ease: "none" }, T0);
    tl.to("#l-fill", { scaleX: 0.02, duration: 4.5, ease: "none" }, T0);
    tl.to("#l-knob", { x: 29, duration: 4.5, ease: "none" }, T0);
    [560, 680, 800, 960, 1080, 1200, 1320, 1440].forEach((left, i) => {
      const at = T0 + (left - 500) / SPEED;
      tl.to(`#l-c${i + 1}`, { color: GOLD, duration: 0.12 }, at);
      tl.to(`#l-n${i + 1}`, { backgroundColor: GOLD, duration: 0.1 }, at);
      tl.to(`#l-n${i + 1}`, { backgroundColor: "#b9aef5", duration: 0.3 }, at + 0.34);
    });
    tl.set("#l-t0", { opacity: 0 }, T0 + 2);
    tl.set("#l-t1", { opacity: 1 }, T0 + 2);
    tl.set("#l-t1", { opacity: 0 }, T0 + 4);
    tl.set("#l-t2", { opacity: 1 }, T0 + 4);
    tl.to("#l-toast", { opacity: 0, y: -12, duration: 0.3, ease: "power2.in" }, 14.2);
    tl.set("#l-pause", { opacity: 0 }, 14.87);
    tl.set("#l-play", { opacity: 1 }, 14.87);

    // ---- back to the start so the clip loops ----
    tl.to("#l-lyric", { opacity: 0, duration: 0.25 }, 15.05);
    tl.to("#l-notes", { x: 0, duration: 0.45, ease: "power2.inOut" }, 15.1);
    tl.to("#l-fill", { scaleX: 0, duration: 0.45, ease: "power2.inOut" }, 15.1);
    tl.to("#l-knob", { x: 0, duration: 0.45, ease: "power2.inOut" }, 15.1);
    tl.to("#l-n1, #l-n2, #l-n3, #l-n4, #l-n5, #l-n6, #l-n7, #l-n8", { backgroundColor: "#8f84d8", duration: 0.3 }, 15.1);
    tl.set("#l-t2", { opacity: 0 }, 15.3);
    tl.set("#l-t0", { opacity: 1 }, 15.3);
    tl.set("#l-c1, #l-c2, #l-c3, #l-c4, #l-c5, #l-c6, #l-c7, #l-c8", { color: WHITE }, 15.35);
    tl.to("#l-step3", { ...OFF, duration: 0.25 }, 15.35);
    tl.to("#l-step1", { ...ON, duration: 0.25 }, 15.4);
    tl.to("#l-nolyric", { opacity: 1, duration: 0.3 }, 15.45);

    window.__timelines["lyrics"] = tl;
  </script>
</template>
