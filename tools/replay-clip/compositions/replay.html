    const tl = gsap.timeline({ paused: true });

    const click = (at) =>
      tl.fromTo("#p-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);

    // The roll scrolls 200 px a second from 0.3 s; a note at x crosses the
    // playhead (x = 500) at 0.3 + (x - 500) / 200. Each entry: [card, time, kind].
    const T0 = 0.3;
    const SPEED = 200;
    const SCROLL = 14.7;
    const JUDGE = [
      [1, 0.8, "pop"],
      [2, 1.45, "pop"],
      [3, 2.1, "pop"],
      [4, 2.85, "pop"],
      [5, 3.7, "pop"],

    tl.to("#p-knob", { x: 56, duration: SCROLL, ease: "none" }, T0);
    JUDGE.forEach(([id, at, kind]) => {
      const sel = `#p-j${id}`;
      if (kind === "miss") {
        // MISS does not pop: it appears flat and sinks while fading
        tl.fromTo(sel, { opacity: 0, y: 0, scale: 1 }, { opacity: 1, duration: 0.08 }, at);
        tl.to(sel, { opacity: 0, y: 22, duration: 0.4, ease: "power1.in" }, at + 0.95);
      } else {
        const hold = kind === "long" ? 1.0 : 0.5;
        tl.fromTo(sel, { opacity: 0, y: 0, scale: 1.55, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.4)" }, at);
