  <script>
    const tl = gsap.timeline({ paused: true });
    const ON = { backgroundColor: "#c8befa", color: "#1a1030", borderColor: "#c8befa" };
    const OFF = { backgroundColor: "#0c0c10", color: "#b9b5c8", borderColor: "rgba(255,255,255,0.16)" };
    const click = (at) =>
      tl.fromTo("#k-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);
    const toggle = (n, on, at) => {
      tl.to(`#k-t${n}-on`, { opacity: on ? 1 : 0, duration: 0.2 }, at);
      tl.to(`#k-t${n}-knob`, { x: on ? 44 : 0, backgroundColor: on ? "#1a1030" : "#d6d2e2", duration: 0.25, ease: "power3.out" }, at);
    };

    const mix = { v: 27 };
    const mixEl = document.querySelector("#k-mix");
    const showMix = () => {
      mixEl.textContent = Math.round(mix.v) + "%";
    };

    // ---- start state (also the loop point) ----
    gsap.set("#k-step1", ON);
    gsap.set("#k-step2, #k-step3", OFF);
    gsap.set("#k-v1, #k-v2", { opacity: 0 });
    gsap.set("#k-cursor-in", { x: 1240, y: 700 });
    gsap.set("#k-fill", { scaleX: 0.27, transformOrigin: "0% 50%" });
    gsap.set("#k-mixrow", { opacity: 0.35 });
    gsap.set("#k-lane-v, #k-conn-v", { opacity: 0.2 });
    gsap.set(".tails", { scaleX: 0, scaleY: 0, opacity: 0, transformOrigin: "0% 50%" });
    gsap.set(".vmain", { scaleY: 0.55, transformOrigin: "50% 50%" });
    gsap.set(".mbar", { scaleY: 0.6, transformOrigin: "50% 50%" });

    // ---- step 1: raise the key twice (0 - 4.6 s) ----
    tl.fromTo("#k-cursor-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
    tl.to("#k-cursor-in", { x: 880, y: 872, duration: 0.8, ease: "power3.inOut" }, 0.35);
    [
      [1.3, 1],
      [2.3, 2],
    ].forEach(([at, n]) => {
      click(at);
      tl.fromTo("#k-plus-glow", { opacity: 0 }, { opacity: 0.5, duration: 0.1, yoyo: true, repeat: 1 }, at);
      tl.set(`#k-v${n - 1}`, { opacity: 0 }, at + 0.06);
      tl.set(`#k-v${n}`, { opacity: 1 }, at + 0.06);
      tl.fromTo(`#k-v${n}`, { scale: 1.35, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out" }, at + 0.06);
      tl.to("#k-notes, #k-range", { y: -26 * n, duration: 0.5, ease: "back.out(1.8)" }, at + 0.08);
    });
    tl.to("#k-ghosts", { opacity: 1, duration: 0.25 }, 1.38);
    tl.fromTo("#k-pill", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.45);

    // ---- step 2: vocal return (4.6 - 9.3 s) ----
    tl.to("#k-cursor-in", { x: 1672, y: 84, duration: 0.85, ease: "power3.inOut" }, 3.9);
    click(4.85);
    tl.to("#k-hp-btn", { backgroundColor: "rgba(200,190,250,0.28)", borderColor: "#c8befa", duration: 0.2 }, 4.85);
    tl.to("#k-step1", { ...OFF, duration: 0.3 }, 4.95);
    tl.to("#k-step2", { ...ON, duration: 0.3 }, 4.95);
    tl.fromTo("#k-panel-in", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 4.95);
    tl.to(".mbar", { scaleY: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 21, stagger: 0.04 }, 5.2);
    tl.to("#k-cursor-in", { x: 1724, y: 204, duration: 0.6, ease: "power3.inOut" }, 6.1);
    click(6.85);
    toggle(1, true, 6.9);
    tl.to("#k-lane-v, #k-conn-v", { opacity: 1, duration: 0.3 }, 6.95);
    tl.to("#k-out", { borderColor: "#c8befa", duration: 0.3 }, 7.0);
    tl.to(".vmain", { scaleY: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 21, stagger: 0.08 }, 7.0);

    // ---- step 3: hall reverb and its mix (9.3 - 14.3 s) ----
    tl.to("#k-cursor-in", { x: 1724, y: 308, duration: 0.5, ease: "power3.inOut" }, 8.9);
    click(9.55);
    toggle(2, true, 9.6);
    tl.to("#k-step2", { ...OFF, duration: 0.3 }, 9.6);
    tl.to("#k-step3", { ...ON, duration: 0.3 }, 9.6);
    tl.to("#k-mixrow", { opacity: 1, duration: 0.3 }, 9.65);
    tl.to(".tails", { scaleX: 0.5, scaleY: 0.5, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.05 }, 9.7);
    tl.to("#k-cursor-in", { x: 1354, y: 388, duration: 0.6, ease: "power3.inOut" }, 10.5);
    // drag the mix from 27% to 62%: 126 px on the 360 px track
    tl.to("#k-cursor-in, #k-knob", { x: "+=126", duration: 1.3, ease: "power2.inOut" }, 11.25);
    tl.to("#k-fill", { scaleX: 0.62, duration: 1.3, ease: "power2.inOut" }, 11.25);
    tl.to(mix, { v: 62, duration: 1.3, ease: "power2.inOut", onUpdate: showMix }, 11.25);
    tl.to(".tails", { scaleX: 1, scaleY: 1, duration: 1.3, ease: "power2.inOut" }, 11.25);
    tl.to("#k-cursor-in", { opacity: 0, duration: 0.25 }, 12.8);

    // ---- back to the start so the clip loops ----
    tl.to("#k-panel-in", { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, 14.2);
    tl.to("#k-hp-btn", { backgroundColor: "rgba(200,190,250,0)", borderColor: "rgba(255,255,255,0.22)", duration: 0.25 }, 14.25);
    tl.to("#k-notes, #k-range", { y: 0, duration: 0.4, ease: "power3.inOut" }, 14.4);
    tl.to("#k-ghosts, #k-pill", { opacity: 0, duration: 0.25 }, 14.4);
    tl.set("#k-v2", { opacity: 0 }, 14.55);
    tl.set("#k-v0", { opacity: 1 }, 14.55);
    tl.to("#k-step3", { ...OFF, duration: 0.25 }, 14.5);
    tl.to("#k-step1", { ...ON, duration: 0.25 }, 14.55);
    toggle(1, false, 14.6);
    toggle(2, false, 14.6);
    tl.set("#k-knob", { x: 0 }, 14.6);
    tl.set("#k-fill", { scaleX: 0.27 }, 14.6);
    tl.to(mix, { v: 27, duration: 0.04, onUpdate: showMix }, 14.6);
    tl.set("#k-mixrow", { opacity: 0.35 }, 14.6);
    tl.set("#k-lane-v, #k-conn-v", { opacity: 0.2 }, 14.6);
    tl.set("#k-out", { borderColor: "rgba(255,255,255,0)" }, 14.6);
    tl.set(".tails", { scaleX: 0, scaleY: 0, opacity: 0 }, 14.6);

    window.__timelines["keyvoice"] = tl;
  </script>
