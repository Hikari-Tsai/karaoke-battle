    <div id="d-steps" class="clip layer" data-start="0" data-duration="15" data-track-index="4">
      <div class="step" id="d-step1" style="left: 356px; width: 340px">1　下載分析檔</div>
      <div class="step-arrow" style="left: 722px">›</div>
      <div class="step" id="d-step2" style="left: 770px; width: 380px">2　貼給 AI 助理</div>
      <div class="step-arrow" style="left: 1176px">›</div>
      <div class="step" id="d-step3" style="left: 1224px; width: 340px">3　得到演唱建議</div>
    </div>

    <!-- 5. Pointer -->
    <div id="d-cursor" class="clip layer" data-start="0" data-duration="15" data-track-index="5" data-layout-ignore>
      <svg id="d-cursor-in" viewBox="0 0 44 44">
        <path d="M6 3 L6 35 L15 27 L21 41 L27 38 L21 25 L33 25 Z" fill="#ffffff" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const ON = { backgroundColor: "#c8befa", color: "#1a1030", borderColor: "#c8befa" };
    const OFF = { backgroundColor: "#0c0c10", color: "#b9b5c8", borderColor: "rgba(255,255,255,0.16)" };
    const click = (at) =>
      tl.fromTo("#d-cursor-in", { scale: 1 }, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "20% 10%" }, at);

    // ---- start state (also the loop point) ----
    tl.set("#d-app-in", { opacity: 1, scale: 1, filter: "blur(0px)" }, 0);
    tl.set("#d-step1", ON, 0);
    tl.set("#d-step2, #d-step3", OFF, 0);
    tl.set("#d-dialog-in", { scale: 0.94, transformOrigin: "50% 50%" }, 0);
    tl.set("#d-cursor-in", { x: 1560, y: 780 }, 0);
    tl.set("#d-chip-in", { x: 1075, y: 689, scale: 0.6, transformOrigin: "50% 50%" }, 0);

    // ---- step 1: open the dialog and download (0 - 5.1 s) ----
    tl.fromTo("#d-cursor-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.25);
    tl.to("#d-cursor-in", { x: 1352, y: 84, duration: 0.8, ease: "power3.inOut" }, 0.3);
    click(1.2);
    tl.fromTo("#d-ai-btn-glow", { opacity: 0 }, { opacity: 0.45, duration: 0.1, yoyo: true, repeat: 1 }, 1.2);
    tl.fromTo("#d-scrim-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.35);
    tl.fromTo("#d-dialog-in", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 1.4);
    tl.to("#d-cursor-in", { x: 1268, y: 722, duration: 0.75, ease: "power3.inOut" }, 3.8);
    click(4.65);
    tl.fromTo("#d-dl-btn", { filter: "brightness(1)" }, { filter: "brightness(1.35)", duration: 0.1, yoyo: true, repeat: 1 }, 4.65);

    // ---- the file leaves the app and the chat builds around it ----
    tl.fromTo("#d-chip-in", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 4.75);
    tl.to("#d-step1", { ...OFF, duration: 0.3 }, 5.0);
    tl.to("#d-step2", { ...ON, duration: 0.3 }, 5.0);
    tl.to("#d-app-in", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, 5.1);
    tl.to("#d-cursor-in", { opacity: 0, duration: 0.2 }, 5.1);
    tl.fromTo("#d-chat-in", { opacity: 0, scale: 1.03, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 5.35);
    tl.to("#d-chip-in", { x: 252, y: 864, duration: 0.85, ease: "power3.inOut" }, 5.2);
    tl.fromTo("#d-placeholder", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 5.8);

    // ---- step 2: type and send (6.1 - 7.5 s) ----
    tl.fromTo("#d-typed span", { opacity: 0 }, { opacity: 1, duration: 0.04, stagger: 0.07 }, 6.15);
    tl.set("#d-cursor-in", { x: 1760, y: 1010 }, 6.1);
    tl.to("#d-cursor-in", { opacity: 1, duration: 0.2 }, 6.3);
    tl.to("#d-cursor-in", { x: 1722, y: 896, duration: 0.6, ease: "power3.inOut" }, 6.35);
    click(7.15);
    tl.fromTo("#d-send", { scale: 1 }, { scale: 0.86, duration: 0.09, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 7.15);
    tl.to("#d-chip-in", { opacity: 0, y: 820, duration: 0.25, ease: "power2.in" }, 7.3);
    tl.to("#d-typed", { opacity: 0, duration: 0.2 }, 7.3);
    tl.to("#d-placeholder", { opacity: 1, duration: 0.3 }, 7.55);
    tl.fromTo("#d-bubble", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 7.4);
    tl.to("#d-cursor-in", { opacity: 0, duration: 0.25 }, 7.65);

    // ---- step 3: the answer (7.8 - 14.5 s) ----
    tl.fromTo("#d-avatar", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 7.85);
    tl.fromTo("#d-dot1", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 8.0);
    tl.fromTo("#d-dot2", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 8.15);
    tl.fromTo("#d-dot3", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 8.3);
    tl.to(".dot", { opacity: 0, duration: 0.15 }, 8.5);
    tl.to("#d-step2", { ...OFF, duration: 0.3 }, 8.5);
    tl.to("#d-step3", { ...ON, duration: 0.3 }, 8.5);
    tl.fromTo("#d-summary", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 8.65);
    [
      ["#d-tip1", 9.1],
      ["#d-tip2", 9.75],
      ["#d-tip3", 10.4],
    ].forEach(([id, at]) => {
      tl.fromTo(id, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, at);
      tl.fromTo(id + " .tip-ev", { opacity: 0 }, { opacity: 1, duration: 0.25 }, at + 0.18);
      tl.fromTo(id + " .tip-do", { opacity: 0 }, { opacity: 1, duration: 0.25 }, at + 0.34);
    });

    // ---- back to the start so the clip loops ----
    tl.to("#d-chat-in", { opacity: 0, duration: 0.3, ease: "power2.in" }, 14.5);
    tl.to("#d-step3", { ...OFF, duration: 0.25 }, 14.6);
    tl.to("#d-step1", { ...ON, duration: 0.25 }, 14.65);
    tl.set("#d-scrim-in", { opacity: 0 }, 14.4);
    tl.set("#d-dialog-in", { opacity: 0 }, 14.4);
    tl.to("#d-app-in", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power2.out" }, 14.66);

    window.__timelines["demo"] = tl;
  </script>
</template>
